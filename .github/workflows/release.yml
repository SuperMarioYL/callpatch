name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Cross-build binaries
        run: |
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              [ "$os" = "windows" ] && ext=".exe"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w" \
                -o "dist/callpatch-${os}-${arch}${ext}" ./cmd/callpatch
            done
          done
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag may be pushed moments before the release object exists
          # (the publish harness creates it after the branch push), so wait
          # for it; if it never appears, create the release here.
          for i in $(seq 1 12); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber && exit 0
            fi
            sleep 10
          done
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "callpatch $GITHUB_REF_NAME" \
            --notes "callpatch $GITHUB_REF_NAME binaries"
