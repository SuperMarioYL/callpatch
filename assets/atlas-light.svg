<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：Coding Agent → CallPatch 修复代理 → 本地 CN 模型">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- base connectors -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="210" y1="180" x2="355" y2="180" marker-end="url(#ah-l)"/>
    <line x1="525" y1="180" x2="670" y2="180" marker-end="url(#ah-l)"/>
  </g>
  <!-- marching-dash data flow (period 16, 32->0 = 2 periods -> seamless) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="180" x2="349" y2="180" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="525" y1="180" x2="664" y2="180" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- data packet dots -->
  <g>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M210,180 L349,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M525,180 L664,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes (breathing fill-opacity 0.10<->0.18, staggered) -->
  <g>
    <rect x="40" y="130" width="170" height="100" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">Coding Agent</text>
    <text x="125" y="198" text-anchor="middle" font-size="11" fill="#6E6E73">Codex · Cursor</text>

    <rect x="355" y="110" width="170" height="140" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#0A4F9E">CallPatch</text>
    <text x="440" y="172" text-anchor="middle" font-size="11" fill="#6E6E73">:8080 repair proxy</text>
    <text x="440" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#0A4F9E">RepairSpec</text>
    <text x="440" y="220" text-anchor="middle" font-size="11" fill="#6E6E73">brace · fence · sentinel</text>

    <rect x="670" y="130" width="170" height="100" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">Local CN Model</text>
    <text x="755" y="196" text-anchor="middle" font-size="11" fill="#6E6E73">llama.cpp · vLLM</text>
    <text x="755" y="214" text-anchor="middle" font-size="11" fill="#6E6E73">Qwen3 · DeepSeek</text>
  </g>
</svg>
